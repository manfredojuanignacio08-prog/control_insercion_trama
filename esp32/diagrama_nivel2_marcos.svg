<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fl" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2B6CB0"/></marker>
    <marker id="flg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f7a3d"/></marker>
  </defs>

  <rect width="1000" height="640" fill="#faf5ec"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#7c2155">Nivel 2 — Etapa de control de marcos (Dobby)</text>
  <text x="500" y="56" text-anchor="middle" font-size="12.5" fill="#6b5b53">Cómo el ESP32 dicta la secuencia del dibujo moviendo los marcos del telar · interviniendo las bobinas de selección ya instaladas</text>

  <!-- BACKEND -->
  <rect x="40" y="90" width="180" height="70" rx="10" fill="#eef3fd" stroke="#2B6CB0" stroke-width="2"/>
  <text x="130" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2B6CB0">BACKEND</text>
  <text x="130" y="137" text-anchor="middle" font-size="10.5">Guarda la secuencia</text>
  <text x="130" y="151" text-anchor="middle" font-size="10.5">del patrón (matriz)</text>

  <line x1="220" y1="125" x2="285" y2="125" stroke="#2B6CB0" stroke-width="2" marker-end="url(#fl)"/>
  <text x="252" y="118" text-anchor="middle" font-size="9.5" fill="#2B6CB0">WiFi</text>

  <!-- ESP32 -->
  <rect x="290" y="90" width="180" height="70" rx="10" fill="#fff8e6" stroke="#b45309" stroke-width="2"/>
  <text x="380" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#b45309">ESP32</text>
  <text x="380" y="137" text-anchor="middle" font-size="10.5">Pide la secuencia y</text>
  <text x="380" y="151" text-anchor="middle" font-size="10.5">manda las órdenes</text>

  <line x1="470" y1="125" x2="535" y2="125" stroke="#2B6CB0" stroke-width="2" marker-end="url(#fl)"/>
  <text x="502" y="118" text-anchor="middle" font-size="9.5" fill="#2B6CB0">3 salidas</text>

  <!-- 74HC595 -->
  <rect x="540" y="90" width="200" height="70" rx="10" fill="#f4eefb" stroke="#7048a8" stroke-width="2"/>
  <text x="640" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#7048a8">GPIO del ESP32</text>
  <text x="640" y="133" text-anchor="middle" font-size="10.5">Salidas directas</text>
  <text x="640" y="148" text-anchor="middle" font-size="10.5">una por lector óptico</text>

  <!-- FUENTE 24V AC -->
  <rect x="770" y="90" width="190" height="70" rx="10" fill="#fdeeee" stroke="#8b1f1f" stroke-width="2"/>
  <text x="865" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b1f1f">ALIMENTACIÓN 24 V AC</text>
  <text x="865" y="133" text-anchor="middle" font-size="10.5">Alimenta las bobinas</text>
  <text x="865" y="148" text-anchor="middle" font-size="10.5">(NO desde el ESP32)</text>

  <line x1="865" y1="160" x2="865" y2="205" stroke="#8b1f1f" stroke-width="2" marker-end="url(#fl)"/>
  <text x="875" y="182" font-size="9.5" fill="#8b1f1f">alimentación de potencia</text>

  <!-- SSR -->
  <rect x="120" y="205" width="760" height="40" rx="8" fill="#f4eefb" stroke="#7048a8" stroke-width="1.5"/>
  <text x="500" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#7048a8">RELÉS DE ESTADO SÓLIDO (SSR) — uno por lector óptico · reemplazan la interrupción del papel</text>

  <line x1="640" y1="160" x2="640" y2="205" stroke="#7048a8" stroke-width="2" marker-end="url(#fl)"/>
  <text x="650" y="182" font-size="9.5" fill="#7048a8">señal de cada canal</text>

  <line x1="500" y1="245" x2="500" y2="262" stroke="#1f7a3d" stroke-width="2"/>
  <line x1="105" y1="262" x2="895" y2="262" stroke="#1f7a3d" stroke-width="2"/>
  <text x="500" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f7a3d">LECTORES ÓPTICOS → plaquetas del telar → BOBINAS DE SELECCIÓN (ya instaladas)</text>

  <g font-size="10.5">
    <rect x="60" y="288" width="98" height="48" rx="7" fill="#edf7ee" stroke="#1f7a3d" stroke-width="1.5"/>
    <text x="109" y="308" text-anchor="middle" font-weight="bold">Bobina 1</text><text x="109" y="325" text-anchor="middle">Marco 1</text>
    <rect x="170" y="288" width="98" height="48" rx="7" fill="#edf7ee" stroke="#1f7a3d" stroke-width="1.5"/>
    <text x="219" y="308" text-anchor="middle" font-weight="bold">Bobina 2</text><text x="219" y="325" text-anchor="middle">Marco 2</text>
    <rect x="280" y="288" width="98" height="48" rx="7" fill="#edf7ee" stroke="#1f7a3d" stroke-width="1.5"/>
    <text x="329" y="308" text-anchor="middle" font-weight="bold">Bobina 3</text><text x="329" y="325" text-anchor="middle">Marco 3</text>
    
    
    
    
    
  </g>

  <line x1="500" y1="336" x2="500" y2="356" stroke="#1f7a3d" stroke-width="2" marker-end="url(#flg)"/>

  <!-- TELAR -->
  <rect x="50" y="356" width="900" height="96" rx="10" fill="#edf7ee" stroke="#1f7a3d" stroke-width="2.5"/>
  <text x="500" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f7a3d">TELAR — Marcos (cada uno sube o baja un grupo de hilos)</text>
  <text x="500" y="404" text-anchor="middle" font-size="11">En cada pasada, el ESP32 decide qué marcos suben. Esa combinación forma el dibujo.</text>
  <text x="500" y="421" text-anchor="middle" font-size="11">Un patrón repetitivo = una secuencia corta de combinaciones de marcos, que se repite en bucle.</text>
  <text x="500" y="440" text-anchor="middle" font-size="10.5" font-style="italic" fill="#1f7a3d">Esta etapa reemplaza la función de la cinta de papel perforada del dobby mecánico.</text>

  <!-- PROTECCION OBLIGATORIA -->
  <rect x="50" y="470" width="900" height="118" rx="10" fill="#fff8e6" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="70" y="492" font-size="12" font-weight="bold" fill="#b45309">El SSR no tiene partes móviles: soporta las ~3 conmutaciones por segundo del telar sin desgastarse.</text>
  <text x="70" y="514" font-size="10.5">El sistema corta la señal del lector óptico, no la corriente de la bobina: las plaquetas del telar quedan intactas.</text>
  
  <text x="70" y="554" font-size="10.5" font-weight="bold">Pendiente de medir: consumo de una bobina (define el amperaje del SSR) y velocidad real en pasadas por minuto.</text>
  <text x="70" y="571" font-size="10.5">Ambos se miden con la máquina en marcha, antes de comprar la etapa de potencia.</text>

  <text x="960" y="620" text-anchor="end" font-size="10.5" fill="#6b5b53">Control de Inserción de Trama · Nivel 2 (marcos / dobby)</text>
</svg>
