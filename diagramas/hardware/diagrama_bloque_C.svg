<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="IBM Plex Sans, system-ui, sans-serif">
<rect width="1080" height="620" fill="#F6F8FA"/>
<text x="540.0" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1E3A5F" font-family="Questrial, sans-serif">Bloque C · Sensor de pasada</text>
<text x="540.0" y="52" text-anchor="middle" font-size="10.5" fill="#6B7684" font-family="IBM Plex Mono, ui-monospace, monospace">DEL TELAR AL ESP32 · UN PULSO POR PASADA · CON AISLAMIENTO</text>
<rect x="28" y="72" width="452" height="470" rx="10" fill="#FFF9F0" stroke="#9C5C0A" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="254" y="94" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9C5C0A" font-family="IBM Plex Mono, ui-monospace, monospace">LADO TELAR · ALIMENTACIÓN DE LA MÁQUINA</text>
<rect x="58" y="110" width="392" height="72" rx="8" fill="#EDF1F5" stroke="#CDD8E0" stroke-width="1.6"/>
<text x="254.0" y="132" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E3A5F" font-family="Questrial, sans-serif">24 V EN ALTERNA DEL TELAR</text>
<text x="254.0" y="150" text-anchor="middle" font-size="9.5" fill="#6B7684">El sensor necesita continua, así que hay que rectificar</text>
<line x1="254" y1="182" x2="254" y2="206" stroke="#1F2937" stroke-width="2.2"/>
<rect x="58" y="206" width="180" height="66" rx="8" fill="#FFFFFF" stroke="#CDD8E0" stroke-width="1.6"/>
<text x="148.0" y="228" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E3A5F" font-family="Questrial, sans-serif">PUENTE DB157</text>
<text x="148.0" y="246" text-anchor="middle" font-size="9.5" fill="#6B7684">Rectifica los dos semiciclos</text>
<line x1="238" y1="239" x2="270" y2="239" stroke="#1F2937" stroke-width="2.2"/>
<rect x="270" y="206" width="180" height="66" rx="8" fill="#FFFFFF" stroke="#CDD8E0" stroke-width="1.6"/>
<text x="360.0" y="228" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E3A5F" font-family="Questrial, sans-serif">CAPACITOR 470 µF 50 V</text>
<text x="360.0" y="246" text-anchor="middle" font-size="9.5" fill="#6B7684">Aplana el rectificado</text>
<line x1="254" y1="272" x2="254" y2="296" stroke="#1F2937" stroke-width="2.2"/>
<rect x="58" y="296" width="392" height="66" rx="8" fill="#FFFFFF" stroke="#CDD8E0" stroke-width="1.6"/>
<text x="254.0" y="318" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E3A5F" font-family="Questrial, sans-serif">REGULADOR 7824</text>
<text x="254.0" y="336" text-anchor="middle" font-size="9.5" fill="#6B7684">Fija la salida en 24 V · evita pasar los 36 V que tolera el sensor</text>
<text x="254" y="378" text-anchor="middle" font-size="9" fill="#6B7684">Un 100 nF entre la salida y masa, cerca del regulador</text>
<line x1="254" y1="362" x2="254" y2="396" stroke="#1F2937" stroke-width="2.2"/>
<rect x="58" y="396" width="392" height="100" rx="8" fill="#FFFFFF" stroke="#CDD8E0" stroke-width="1.6"/>
<text x="254.0" y="418" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E3A5F" font-family="Questrial, sans-serif">SENSOR INDUCTIVO LJ12A3-4-Z/BX</text>
<text x="254.0" y="436" text-anchor="middle" font-size="9.5" fill="#6B7684">NPN normal abierto · alcance 4 mm sobre acero</text>
<text x="254.0" y="451" text-anchor="middle" font-size="9.5" fill="#6B7684"></text>
<text x="254.0" y="466" text-anchor="middle" font-size="9.5" fill="#6B7684">MARRÓN (+) al regulador   ·   AZUL (−) a masa   ·   NEGRO (señal)</text>
<text x="254" y="518" text-anchor="middle" font-size="9" fill="#9C5C0A" font-weight="bold">Al gabinete van solo dos hilos: negro y azul</text>
<line x1="450" y1="446" x2="530" y2="446" stroke="#1F2937" stroke-width="2.2"/>
<rect x="530" y="424" width="72" height="26" rx="3" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.6"/>
<text x="566" y="441" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">2,2 kΩ</text>
<text x="566" y="466" text-anchor="middle" font-size="8.5" fill="#6B7684">con 24 V regulados</text>
<line x1="602" y1="437" x2="650" y2="437" stroke="#1F2937" stroke-width="2.2"/>
<line x1="450" y1="480" x2="650" y2="480" stroke="#1F2937" stroke-width="2.2"/>
<text x="540" y="496" text-anchor="middle" font-size="8.5" fill="#6B7684">negro (señal)</text>
<rect x="650" y="390" width="150" height="130" rx="8" fill="#FFFFFF" stroke="#CDD8E0" stroke-width="1.6"/>
<text x="725.0" y="412" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E3A5F" font-family="Questrial, sans-serif">PC817</text>
<text x="725.0" y="430" text-anchor="middle" font-size="9.5" fill="#6B7684"></text>
<text x="725.0" y="445" text-anchor="middle" font-size="9.5" fill="#6B7684">pata 1  ·  pata 4</text>
<text x="725.0" y="460" text-anchor="middle" font-size="9.5" fill="#6B7684"></text>
<text x="725.0" y="475" text-anchor="middle" font-size="9.5" fill="#6B7684">pata 2  ·  pata 3</text>
<line x1="725" y1="424" x2="725" y2="512" stroke="#CDD8E0" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="725" y="538" text-anchor="middle" font-size="9" font-weight="bold" fill="#9C5C0A">frontera de aislamiento</text>
<rect x="828" y="72" width="224" height="470" rx="10" fill="#EDF1F5" stroke="#3D6B96" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="940" y="94" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1E3A5F" font-family="IBM Plex Mono, ui-monospace, monospace">LADO ESP32 · 3,3 V</text>
<line x1="800" y1="424" x2="860" y2="424" stroke="#1F2937" stroke-width="2.2"/>
<line x1="860" y1="424" x2="860" y2="360" stroke="#1F2937" stroke-width="2.2"/>
<rect x="826" y="330" width="68" height="26" rx="3" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.6"/>
<text x="860" y="347" text-anchor="middle" font-size="10" font-weight="bold" fill="#1F2937">10 kΩ</text>
<line x1="860" y1="330" x2="860" y2="308" stroke="#1F2937" stroke-width="2.2"/>
<text x="860" y="302" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E3A5F" font-family="IBM Plex Mono, ui-monospace, monospace">3,3 V</text>
<rect x="860" y="396" width="172" height="72" rx="8" fill="#1E3A5F" stroke="#1E3A5F" stroke-width="1.6"/>
<text x="946.0" y="418" text-anchor="middle" font-size="12.5" font-weight="600" fill="#FFFFFF" font-family="Questrial, sans-serif">ESP32</text>
<text x="946.0" y="436" text-anchor="middle" font-size="9.5" fill="#7FA8C9">Pin 35 · solo entrada</text>
<text x="946.0" y="451" text-anchor="middle" font-size="9.5" fill="#7FA8C9">Interrupción por flanco</text>
<line x1="800" y1="480" x2="946" y2="480" stroke="#1F2937" stroke-width="2.2"/>
<line x1="946" y1="468" x2="946" y2="480" stroke="#1F2937" stroke-width="2.2"/>
<text x="946" y="500" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1E3A5F">GND del sistema</text>
<rect x="28" y="556" width="1024" height="46" rx="6" fill="#F2F5F8" stroke="#9C5C0A" stroke-width="1.4"/>
<text x="42" y="576" font-size="9.5" font-weight="bold" fill="#9C5C0A">El azul del sensor va a la pata 2 del optoacoplador, nunca al negativo del ESP32.</text>
<text x="42" y="591" font-size="9.5" font-weight="normal" fill="#1F2937">Unir los dos negativos anula el aislamiento entre el telar y el circuito, que es justamente lo que protege al equipo.</text>
</svg>