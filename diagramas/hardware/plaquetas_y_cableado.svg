<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1110" font-family="IBM Plex Sans, system-ui, sans-serif">
<rect width="1400" height="1110" fill="#F6F8FA"/>
<text x="700.0" y="34" font-size="20" font-weight="bold" fill="#1E3A5F" text-anchor="middle" font-family="Questrial, IBM Plex Sans, sans-serif">Las plaquetas y el cableado de todo el sistema</text>
<text x="700.0" y="56" font-size="11" font-weight="normal" fill="#6B7684" text-anchor="middle">Qué va en cada plaqueta del gabinete y qué cable sale a cada parte del telar. Los GPIO son los del firmware (config.h).</text>
<text x="700.0" y="74" font-size="11" font-weight="normal" fill="#6B7684" text-anchor="middle">Cada cable entra a su plaqueta por un conector (tira de pines) o por una bornera de tornillo: se desconecta sin desoldar.</text>
<rect x="40" y="92" width="360" height="40" rx="6" fill="#FBE9E7" stroke="#B4423C" stroke-width="1.6"/>
<text x="54" y="110" font-size="10.5" font-weight="bold" fill="#B4423C" text-anchor="start">Red 220 V de la fábrica (tomacorriente, no del telar)</text>
<text x="54" y="125" font-size="9.5" font-weight="normal" fill="#1F2937" text-anchor="start">Cable con ficha: fase marrón al fusible · neutro celeste</text>
<polyline points="170,132 170,180" fill="none" stroke="#B4423C" stroke-width="3" stroke-linejoin="round"/>
<rect x="20" y="150" width="1360" height="500" rx="10" fill="none" stroke="#6B7684" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="1366" y="168" font-size="10.5" font-weight="bold" fill="#6B7684" text-anchor="end">GABINETE IP65 · en la pared o en una columna, no sobre el chasis del telar</text>
<rect x="40" y="180" width="300" height="190" rx="8" fill="#FFFFFF" stroke="#B4423C" stroke-width="1.8"/>
<rect x="40" y="180" width="300" height="30" rx="8" fill="#B4423C" stroke="#B4423C" stroke-width="1.8"/>
<rect x="40" y="196" width="300" height="14" rx="0" fill="#B4423C" stroke="#B4423C" stroke-width="0"/>
<text x="54" y="200" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">Plaqueta 1 · Fuente (220 V)</text>
<text x="54" y="232" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Portafusible con fusible de 1 A lento,</text>
<text x="68" y="251" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">en la fase (nunca en el neutro)</text>
<text x="54" y="270" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Fuente HLK-5M05: 220 V → 5 V, 1 A</text>
<text x="54" y="289" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Entrada de red en bornera de tornillo</text>
<text x="54" y="308" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Salida: bornera de +5 V y GND (J1)</text>
<text x="54" y="327" font-size="10" font-weight="bold" fill="#B4423C" text-anchor="start">Del lado de 220 V, nunca conectores dupont</text>
<rect x="40" y="395" width="300" height="235" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.8"/>
<rect x="40" y="395" width="300" height="30" rx="8" fill="#1E3A5F" stroke="#1E3A5F" stroke-width="1.8"/>
<rect x="40" y="411" width="300" height="14" rx="0" fill="#1E3A5F" stroke="#1E3A5F" stroke-width="0"/>
<text x="54" y="415" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">Plaqueta 3 · Módulos de relé</text>
<text x="54" y="447" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Módulo de 2 canales (activo-bajo):</text>
<text x="68" y="466" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">IN1 Marcha · IN2 Pausa</text>
<text x="68" y="485" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">jumper JD-VCC puesto</text>
<text x="54" y="504" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Módulo individual (activo-alto):</text>
<text x="68" y="523" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">S Retroceder</text>
<text x="54" y="542" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">100 nF junto a cada módulo</text>
<text x="54" y="561" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">NO y COM de cada relé, en paralelo</text>
<text x="68" y="580" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">con su botón (borneras B1)</text>
<text x="54" y="599" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">J2 desde la principal: 5 V, GND, IN1 (GPIO 25),</text>
<text x="54" y="618" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">IN2 (GPIO 26) y S (GPIO 27)</text>
<rect x="370" y="180" width="470" height="450" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.8"/>
<rect x="370" y="180" width="470" height="30" rx="8" fill="#1E3A5F" stroke="#1E3A5F" stroke-width="1.8"/>
<rect x="370" y="196" width="470" height="14" rx="0" fill="#1E3A5F" stroke="#1E3A5F" stroke-width="0"/>
<text x="384" y="200" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">Plaqueta 2 · Principal (ESP32 y sensado)</text>
<text x="384" y="232" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">ESP32 enchufado en tiras de pines hembra</text>
<text x="398" y="251" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">se saca para programarlo sin desoldar nada</text>
<text x="384" y="270" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Entrada de 5 V (J1): capacitor de 470 µF</text>
<text x="398" y="289" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">y 100 nF junto al ESP32</text>
<text x="384" y="308" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Arranque seguro de los relés (10 kΩ):</text>
<text x="398" y="327" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">GPIO 25 y 26 a 3,3 V · GPIO 27 a GND</text>
<text x="384" y="346" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Sensado de la botonera, 3 canales iguales:</text>
<text x="398" y="365" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">puente DB157 + capacitor de 22 µF 50 V</text>
<text x="398" y="384" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">+ 2,2 kΩ 1 W → LED del PC817</text>
<text x="398" y="403" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">salida del PC817 con 10 kΩ a 3,3 V →</text>
<text x="398" y="422" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">GPIO 32 Marcha · 33 Pausa · 34 Retroceder</text>
<text x="384" y="441" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">J2 → plaqueta 3 · J3 → plaqueta 4</text>
<text x="384" y="460" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">El lado de 24 V de cada PC817 (puente, capacitor,</text>
<text x="384" y="479" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">resistencia) queda separado del lado del ESP32.</text>
<text x="384" y="498" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">Ningún borne del telar se une con el GND del ESP32.</text>
<rect x="870" y="180" width="490" height="450" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.8"/>
<rect x="870" y="180" width="490" height="30" rx="8" fill="#1E3A5F" stroke="#1E3A5F" stroke-width="1.8"/>
<rect x="870" y="196" width="490" height="14" rx="0" fill="#1E3A5F" stroke="#1E3A5F" stroke-width="0"/>
<text x="884" y="200" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">Plaqueta 4 · Nivel 2 (sensor y selección)</text>
<text x="884" y="232" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Canal del sensor de pasada:</text>
<text x="898" y="251" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">1,2 kΩ (con 12 a 14 V) → LED del PC817</text>
<text x="898" y="270" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">salida con 10 kΩ a 3,3 V → GPIO 35</text>
<text x="884" y="289" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">4 relés LCA110 en zócalo DIP-6, uno por bobina:</text>
<text x="898" y="308" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">GPIO 18, 19, 21, 22 → 330 Ω → pata 1</text>
<text x="898" y="327" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">pata 2 a GND · 10 kΩ de cada GPIO a GND</text>
<text x="898" y="346" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">patas 4 y 6 → borneras B3 · 3 y 5 libres</text>
<text x="884" y="365" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">J3 desde la principal: 3,3 V, GND, GPIO 35,</text>
<text x="898" y="384" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">18, 19, 21 y 22 (7 hilos)</text>
<text x="884" y="403" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Borneras del lado del telar:</text>
<text x="898" y="422" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">B2 sensor (+ del telar y negro del sensor)</text>
<text x="898" y="441" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">B3 relés (pata 4 y pata 6 de cada uno, 8 bornes)</text>
<text x="884" y="460" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">Las patas 4 y 6 y el canal del sensor quedan del</text>
<text x="884" y="479" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">lado del telar: aislados del ESP32 (3.750 V).</text>
<line x1="340" y1="330" x2="370" y2="330" stroke="#1E3A5F" stroke-width="3"/>
<text x="355" y="322" font-size="9.5" font-weight="bold" fill="#1E3A5F" text-anchor="middle">J1</text>
<text x="355" y="348" font-size="8.5" font-weight="normal" fill="#6B7684" text-anchor="middle">+5 V</text>
<line x1="340" y1="520" x2="370" y2="520" stroke="#1E3A5F" stroke-width="3"/>
<text x="355" y="512" font-size="9.5" font-weight="bold" fill="#1E3A5F" text-anchor="middle">J2</text>
<line x1="840" y1="420" x2="870" y2="420" stroke="#1E3A5F" stroke-width="3"/>
<text x="855" y="412" font-size="9.5" font-weight="bold" fill="#1E3A5F" text-anchor="middle">J3</text>
<rect x="20" y="680" width="1360" height="380" rx="10" fill="#FBF1E3" stroke="#9C5C0A" stroke-width="1.6"/>
<text x="40" y="985" font-size="13" font-weight="bold" fill="#9C5C0A" text-anchor="start">TELAR</text>
<text x="40" y="1006" font-size="10.5" font-weight="bold" fill="#9C5C0A" text-anchor="start">Lado de 24 V y de las plaquetas de la máquina:</text>
<text x="40" y="1024" font-size="10.5" font-weight="bold" fill="#9C5C0A" text-anchor="start">nunca se une con el GND del ESP32.</text>
<rect x="40" y="720" width="380" height="230" rx="8" fill="#FFFFFF" stroke="#9C5C0A" stroke-width="1.8"/>
<rect x="40" y="720" width="380" height="30" rx="8" fill="#9C5C0A" stroke="#9C5C0A" stroke-width="1.8"/>
<rect x="40" y="736" width="380" height="14" rx="0" fill="#9C5C0A" stroke="#9C5C0A" stroke-width="0"/>
<text x="54" y="740" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">Botonera del telar</text>
<text x="54" y="772" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Marcha, Pausa y Retroceder · 24 V de alterna</text>
<text x="54" y="791" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">El par NA de cada botón (el que pita al apretar)</text>
<text x="54" y="810" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Cable de 6 conductores de 1 mm²: un par por botón</text>
<text x="54" y="829" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">En el gabinete (borneras B1), cada par va a:</text>
<text x="68" y="848" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">NO y COM de su relé (plaqueta 3)</text>
<text x="68" y="867" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">la entrada de su canal de sensado (plaqueta 2)</text>
<text x="54" y="886" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">La botonera sigue funcionando igual a mano</text>
<rect x="450" y="720" width="390" height="230" rx="8" fill="#FFFFFF" stroke="#9C5C0A" stroke-width="1.8"/>
<rect x="450" y="720" width="390" height="30" rx="8" fill="#9C5C0A" stroke="#9C5C0A" stroke-width="1.8"/>
<rect x="450" y="736" width="390" height="14" rx="0" fill="#9C5C0A" stroke="#9C5C0A" stroke-width="0"/>
<text x="464" y="740" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">Sensor de pasada (Bloque C)</text>
<text x="464" y="772" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Inductivo LJ12A3-4-Z/BX, en el eje que da</text>
<text x="464" y="791" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">una vuelta por pasada, a 2-3 mm del blanco</text>
<text x="464" y="810" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Marrón al + y azul al − de los 12-14 V</text>
<text x="478" y="829" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">de continua del telar</text>
<text x="464" y="848" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Al gabinete van 2 hilos (borneras B2):</text>
<text x="478" y="867" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">el + del telar y el negro del sensor</text>
<text x="464" y="886" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">El azul queda en el − del telar</text>
<rect x="870" y="720" width="490" height="320" rx="8" fill="#FFFFFF" stroke="#9C5C0A" stroke-width="1.8"/>
<rect x="870" y="720" width="490" height="30" rx="8" fill="#9C5C0A" stroke="#9C5C0A" stroke-width="1.8"/>
<rect x="870" y="736" width="490" height="14" rx="0" fill="#9C5C0A" stroke="#9C5C0A" stroke-width="0"/>
<text x="884" y="740" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">Plaqueta del telar · conectores de los 4 lectores</text>
<text x="884" y="772" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Conexión final (la más segura): el relé en lugar del lector.</text>
<text x="884" y="791" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Por cada lector, una bornera de 4 vías en su conector:</text>
<text x="898" y="810" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">el + → resistencia de protección → hilo a la pata 4</text>
<text x="898" y="829" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">(220 Ω 2 W hasta 15 V · 470 Ω 3 W de 15 a 30 V)</text>
<text x="898" y="848" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">señal → hilo a la pata 6</text>
<text x="898" y="867" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">10 kΩ ½ W de la señal al − · referencia al −</text>
<text x="884" y="886" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Los 4 cables del lector, marcados y aislados en otra</text>
<text x="898" y="905" font-size="10" font-weight="normal" fill="#1F2937" text-anchor="start">bornera (se vuelve a conectar en minutos)</text>
<text x="884" y="924" font-size="10.2" font-weight="normal" fill="#1F2937" text-anchor="start">Al gabinete (borneras B3): 2 hilos por canal, 8 en total</text>
<text x="884" y="943" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">Las resistencias quedan junto al conector: un cable</text>
<text x="884" y="962" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">cortado deja la señal en 0 V (papel), y un cable en</text>
<text x="884" y="981" font-size="9.5" font-weight="normal" fill="#6B7684" text-anchor="start">corto queda limitado por la de protección.</text>
<polyline points="230,720 230,668 230,640" fill="none" stroke="#9C5C0A" stroke-width="3" stroke-linejoin="round"/>
<rect x="223" y="643" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#9C5C0A" stroke-width="1.8"/>
<circle cx="230" cy="650" r="2.6" fill="#9C5C0A"/>
<text x="244" y="668" font-size="9.5" font-weight="bold" fill="#9C5C0A" text-anchor="start">B1 · 3 pares</text>
<polyline points="230,643 230,636 190,636 190,630" fill="none" stroke="#9C5C0A" stroke-width="2.4" stroke-linejoin="round"/>
<polyline points="230,643 230,636 520,636 520,630" fill="none" stroke="#9C5C0A" stroke-width="2.4" stroke-linejoin="round"/>
<polyline points="645,720 645,668 980,668 980,640" fill="none" stroke="#9C5C0A" stroke-width="3" stroke-linejoin="round"/>
<rect x="973" y="643" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#9C5C0A" stroke-width="1.8"/>
<circle cx="980" cy="650" r="2.6" fill="#9C5C0A"/>
<text x="994" y="646" font-size="9.5" font-weight="bold" fill="#9C5C0A" text-anchor="start">B2 · 2 hilos</text>
<polyline points="980,643 980,630" fill="none" stroke="#9C5C0A" stroke-width="2.4" stroke-linejoin="round"/>
<polyline points="1115,720 1115,690 1250,690 1250,640" fill="none" stroke="#9C5C0A" stroke-width="3" stroke-linejoin="round"/>
<rect x="1243" y="643" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#9C5C0A" stroke-width="1.8"/>
<circle cx="1250" cy="650" r="2.6" fill="#9C5C0A"/>
<text x="1264" y="668" font-size="9.5" font-weight="bold" fill="#9C5C0A" text-anchor="start">B3 · 8 hilos</text>
<polyline points="1250,643 1250,630" fill="none" stroke="#9C5C0A" stroke-width="2.4" stroke-linejoin="round"/>
<text x="40" y="1086" font-size="10" font-weight="normal" fill="#6B7684" text-anchor="start">Rojo: 220 V (solo en la plaqueta 1) · Azul: 5 V, 3,3 V y señales del ESP32 · Naranja: lado del telar, aislado por los optoacopladores y los LCA110.</text>
<text x="40" y="1102" font-size="10" font-weight="normal" fill="#6B7684" text-anchor="start">Detalle de cada parte: diagrama_bloque_A, diagrama_conexion_electrica, canal_sensor y conexion_final_rele (en esta misma carpeta).</text>
</svg>