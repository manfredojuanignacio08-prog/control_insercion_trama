<text x="30" y="887.88" font-size="14" fill="#FF5050" font-weight="bold">Plaqueta ESP32 (adaptador) · una cara, vista de arriba · pistas de 1 mm</text>
<text x="30" y="911.88" font-size="14" fill="#E0E0E0" font-weight="normal">Tiras hembra de 19 pines para el ESP32 de 38 pines. P1 y P2: tiras macho; de ahí salen los cables a la plaqueta 2.</text>
<text x="30" y="935.88" font-size="14" fill="#E0E0E0" font-weight="normal">Medir el módulo antes de soldar: entre las dos tiras tiene que haber 25,4 mm (si mide otra cosa, se corre la tira derecha).</text>
