document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

te}}\">Vista de frente<\u002Fbutton>\n      <button type=\"button\" class=\"g1-btn\" sc-camel-on-click=\"{{vista34}}\">Vista en 3/4<\u002Fbutton>\n      <button type=\"button\" class=\"g1-btn\" aria-pressed=\"{{nombresStr}}\" sc-camel-on-click=\"{{alternarNombres}}\">Nombres<\u002Fbutton>\n      <button type=\"button\" class=\"g1-btn\" aria-pressed=\"{{oscuroStr}}\" sc-camel-on-click=\"{{alternarTema}}\">Tema oscuro<\u002Fbutton>\n      <button type=\"button\" class=\"g1-btn\" style=\"grid-column: 1 / -1\" sc-camel-on-click=\"{{abrirPlaquetas}}\">Ver plaqueta por plaqueta<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display: {{dispPlaqGrid}}; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 18px 18px 14px; border-bottom: 1px solid var(--borde)\">\n      <button type=\"button\" class=\"g1-btn g1-principal\" style=\"grid-column: 1 / -1\" sc-camel-on-click=\"{{salirPlaquetas}}\">Volver al gabinete<\u002Fbutton>\n      <button type=\"button\" class=\"g1-btn\" style=\"grid-column: 1 / -1\" aria-pressed=\"{{cobreStr}}\" sc-camel-on-click=\"{{darVuelta}}\">{{textoVuelta}}<\u002Fbutton>\n      <button type=\"button\" class=\"g1-btn\" aria-pressed=\"{{girarStr}}\" sc-camel-on-click=\"{{alternarGiro}}\">Girar sola<\u002Fbutton>\n      <button type=\"button\" class=\"g1-btn\" aria-pressed=\"{{oscuroStr}}\" sc-camel-on-click=\"{{alternarTema}}\">Tema oscuro<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display: {{dispGab}}; overflow-y: auto; padding: 6px 10px 18px\">\n      <h2 class=\"g1-h2\" style=\"margin-top: 14px\">Bloque A · Marcha, Pausa y Retroceder<\u002Fh2>\n      <sc-for list=\"{{grupoA}}\" as=\"c\" hint-placeholder-count=\"8\">\n        <button type=\"button\" class=\"g1-item {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\" aria-pressed=\"{{c.activoStr}}\">\n          <span aria-hidden=\"true\" style=\"position: absolute; left: 12px; top: 15px; width: 10px; height: 10px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(127,140,155,.45); background: {{c.color}}\"><\u002Fspan>\n          <b style=\"display: block; font-size: 14.5px; font-weight: 600\">{{c.nombre}}<\u002Fb>\n          <span style=\"display: block; font-size: 13px; line-height: 1.45; margin-top: 2px; opacity: .88\">{{c.descripcion}}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n      <h2 class=\"g1-h2\">Bloque C · Sensor de pasada<\u002Fh2>\n      <sc-for list=\"{{grupoC}}\" as=\"c\" hint-placeholder-count=\"1\">\n        <button type=\"button\" class=\"g1-item {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\" aria-pressed=\"{{c.activoStr}}\">\n          <span aria-hidden=\"true\" style=\"position: absolute; left: 12px; top: 15px; width: 10px; height: 10px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(127,140,155,.45); background: {{c.color}}\"><\u002Fspan>\n          <b style=\"display: block; font-size: 14.5px; font-weight: 600\">{{c.nombre}}<\u002Fb>\n          <span style=\"display: block; font-size: 13px; line-height: 1.45; margin-top: 2px; opacity: .88\">{{c.descripcion}}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n      <h2 class=\"g1-h2\">Bloque D · Bobinas de selección<\u002Fh2>\n      <sc-for list=\"{{grupoD}}\" as=\"c\" hint-placeholder-count=\"1\">\n        <button type=\"button\" class=\"g1-item {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\" aria-pressed=\"{{c.activoStr}}\">\n          <span aria-hidden=\"true\" style=\"position: absolute; left: 12px; top: 15px; width: 10px; height: 10px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(127,140,155,.45); background: {{c.color}}\"><\u002Fspan>\n          <b style=\"display: block; font-size: 14.5px; font-weight: 600\">{{c.nombre}}<\u002Fb>\n          <span style=\"display: block; font-size: 13px; line-height: 1.45; margin-top: 2px; opacity: .88\">{{c.descripcion}}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n      <h2 class=\"g1-h2\">Montaje<\u002Fh2>\n      <sc-for list=\"{{grupoM}}\" as=\"c\" hint-placeholder-count=\"6\">\n        <button type=\"button\" class=\"g1-item {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\" aria-pressed=\"{{c.activoStr}}\">\n          <span aria-hidden=\"true\" style=\"position: absolute; left: 12px; top: 15px; width: 10px; height: 10px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(127,140,155,.45); background: {{c.color}}\"><\u002Fspan>\n          <b style=\"display: block; font-size: 14.5px; font-weight: 600\">{{c.nombre}}<\u002Fb>\n          <span style=\"display: block; font-size: 13px; line-height: 1.45; margin-top: 2px; opacity: .88\">{{c.descripcion}}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display: {{dispPlaq}}; overflow-y: auto; padding: 6px 10px 18px\">\n      <h2 class=\"g1-h2\" style=\"margin-top: 14px\">Plaquetas · tocá una para verla<\u002Fh2>\n      <sc-for list=\"{{plaquetas}}\" as=\"c\" hint-placeholder-count=\"7\">\n        <button type=\"button\" class=\"g1-item {{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\" aria-pressed=\"{{c.activoStr}}\">\n          <span aria-hidden=\"true\" style=\"position: absolute; left: 9px; top: 12px; width: 17px; height: 17px; border-radius: 4px; font-size: 11px; font-weight: 700; line-height: 17px; text-align: center; color: #FFFFFF; box-shadow: 0 0 0 1px rgba(127,140,155,.45); background: {{c.color}}\">{{c.n}}<\u002Fspan>\n          <b style=\"display: block; font-size: 14.5px; font-weight: 600\">{{c.nombre}}<\u002Fb>\n          <span style=\"display: block; font-size: 13px; line-height: 1.45; margin-top: 2px; opacity: .88\">{{c.descripcion}}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Faside>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;exposicion&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.6,&quot;max&quot;:1.4,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;section&quot;:&quot;Render&quot;},&quot;oclusion&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;default&quot;:1,&quot;section&quot;:&quot;Render&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  g1Lista() {\n    if (!this.g1lista) this.g1lista = [\n      { id: 'esp32', grupo: 'A', nombre: 'ESP32 NodeMCU-32', corto: 'ESP32', color: '#121418', descripcion: 'El controlador, en su propia plaqueta desde el 25/10/2026, enchufado en dos tiras hembra de 19 pines: se saca para programarlo sin desoldar nada. Sus salidas P1 y P2 van por cables a los pads de la principal, cada uno por nombre de señal. Recibe las órdenes de la aplicación por WiFi, acciona los relés y detecta cuando alguien usa la botonera. Con la red conectada, su LED azul queda encendido.' },\n      { id: 'reles2', grupo: 'A', nombre: 'Módulo de 2 relés Songle', corto: 'Relés Marcha y Pausa', color: '#2A62C9', descripcion: 'En la plaqueta de relés, sobre separadores de 6 mm con tornillos M3. Aprieta Marcha (IN1, GPIO 25) y Pausa (IN2, GPIO 26) en paralelo con la botonera. Activo en bajo, con el jumper JD-VCC puesto. Trae su optoacoplador, transistor, diodo y LED por canal.' },\n      { id: 'rele1', grupo: 'A', nombre: 'Módulo de 1 relé Tongling', corto: 'Relé Retroceder', color: '#3D6B96', descripcion: 'Al lado del de 2 canales. Aprieta Retroceder (S, GPIO 27). Activo en alto: su resistencia de 10 kΩ va a GND. Al NO y al COM de cada relé llega el par de su botón desde el tablero, y del mismo borne sale el paralelo a su bornera J1, J2 o J3, en la plaqueta del sensado.' },\n      { id: 'sensado', grupo: 'A', nombre: 'Sensado de la botonera', corto: 'Sensado', color: '#7FA8C9', descripcion: 'Plaqueta impresa aparte, diseñada en Proteus y unida a la principal por J4. Tres canales iguales: la bornera J1, J2 o J3, que recibe el paralelo de NO y COM de su relé; en el lugar del puente, una tira de 4 pines que lleva la señal a la plaqueta de los puentes y la trae rectificada; el capacitor de 22 µF 50 V, la resistencia de 2,2 kΩ 1 W y el optoacoplador PC817, que aísla los 24 V del telar. Solo Retroceder (GPIO 34) lleva su pull-up de 10 kΩ a 3,3 V: Marcha y Pausa (GPIO 32 y 33) usan la del ESP32. El + de cada capacitor y la pata 1 de cada PC817 van marcados a mano.' },\n      { id: 'puentes', grupo: 'A', nombre: 'Puentes rectificadores DB157', corto: 'Puentes', color: '#5B6B7C', descripcion: 'En su propia plaqueta impresa desde el 31/10/2026 (en la real, de 80 × 50 mm): los tres DB157, uno por botón, pasan a continua la señal de 24 V de cada botón antes del optoacoplador. Cada uno se une a su canal del sensado por una tira de 4 pines: J9 Marcha, J7 Retroceder y J8 Pausa. En el cable, las patas 3 y 4 van cruzadas: en el sensado el orden es + ~ ~ − y en esta plaqueta, + ~ − ~.' },\n      { id: 'pasivos', grupo: 'A', nombre: 'Resistencias y capacitores', corto: 'Pasivos', color: '#D9C49A', descripcion: 'En la principal: tres resistencias de 10 kΩ para el arranque seguro (GPIO 25 y 26 a 3,3 V, GPIO 27 a GND), el electrolítico de 470 µF en la entrada de 5 V, que sostiene la tensión cuando un relé engancha, y un cerámico de 100 nF entre 3,3 V y GND. En la de relés, un cerámico de 100 nF junto a cada módulo.' },\n      { id: 'fuente', grupo: 'A', nombre: 'Fuente HLK-5M05', corto: 'Fuente 5 V', color: '#1A1B1E', descripcion: 'Módulo de 34 × 20 × 15 mm soldado en su propia plaqueta, separada de las demás: bornera de 220 V arriba y de 5 V abajo, que va a J1 de la principal. Convierte los 220 V de la red en los 5 V del ESP32, los relés y el sensado, aislada del telar.' },\n      { id: 'fusible', grupo: 'A', nombre: 'Fusible de 1 A lento', corto: 'Fusible', color: '#E8EDF1', descripcion: 'Portafusible en línea sobre la fase de 220 V, nunca en el neutro. Protege la fuente si algo falla.' },\n      { id: 'sensorC', grupo: 'C', nombre: 'Entrada del sensor inductivo', corto: 'Sensor de pasada', color: '#2E6E4A', descripcion: 'En la plaqueta del Nivel 2: optoacoplador PC817 con su resistencia de 1,2 kΩ y el pull-up de 10 kΩ, que llevan la señal del LJ12A3 (12 a 14 V) al GPIO 35. El sensor está montado en el telar: a la bornera B2 llegan el positivo del telar y la señal (negro); el azul queda en el negativo del telar.' },\n      { id: 'nivel2', grupo: 'D', nombre: 'Relés LCA110', corto: 'LCA110 ×4', color: '#3F4B5C', descripcion: 'Cuatro relés OptoMOS de IXYS en la plaqueta del Nivel 2, uno por lector óptico, enchufados en zócalos DIP-6 para cambiarlos sin desoldar. Cada uno con su resistencia de 330 Ω y su 10 kΩ a GND; sus patas 4 y 6 van a la bornera B3 de su canal. Conmutan hasta cinco veces por segundo sin desgaste.' },\n      { id: 'plaqueta', grupo: 'M', nombre: 'Plaquetas', corto: 'Plaquetas', color: '#B98D52', descripcion: 'Siete, sobre separadores de bronce: 1, la de la fuente, aparte, con todo lo que lleva 220 V; 2, la principal; 3, la de los módulos de relé; 4, la del Nivel 2; 5, la del sensado de la botonera; 6, la del ESP32, sumada el 25/10/2026 porque en la principal impresa la tira del ESP32 quedó con los pines en otro orden; y 7, la de los puentes rectificadores, sumada el 31/10/2026. Las diseñadas en Proteus (2 a 5 y 7) y la del ESP32 son impresas; la de la fuente, de placa perforada. Las tres pistas que faltaron en la principal y en la del Nivel 2 van con puentes de alambre del lado del cobre.' },\n      { id: 'conectores', grupo: 'M', nombre: 'Conectores J1 a J4', corto: 'Conectores', color: '#C9A44A', descripcion: 'Tiras de pines con cables dupont entre plaquetas: J1 trae los 5 V de la fuente; J2 lleva 5 V, GND, IN1, IN2 y S a los relés; J3, 3,3 V, GND y los GPIO 35, 18, 19, 21 y 22 al Nivel 2; y J4, 3,3 V, GND y los GPIO 32, 33 y 34 al sensado. Entre el sensado y la plaqueta de los puentes, una tira de 4 por canal (J9, J7 y J8), con las patas 3 y 4 cruzadas en el cable. De la plaqueta del ESP32 salen P1 (10 pines) y P2 (5), con cables dupont hasta los pads de J5, J6 y J7 de la principal. Cada plaqueta se desenchufa sin desoldar.' },\n      { id: 'borneras', grupo: 'M', nombre: 'Borneras de tornillo', corto: 'Borneras', color: '#2B58C8', descripcion: 'Entrada de 220 V y salida de 5 V de la fuente; en los módulos de relé, NO y COM de cada relé, donde llega el par de su botón; J1, J2 y J3 en el sensado, una por botón, con el paralelo que sale del relé; B2, del sensor; y B3, de los cuatro canales del Nivel 2. Se desconectan sin desoldar y cada una tiene su rótulo.' },\n      { id: 'cables', grupo: 'M', nombre: 'Cableado', corto: 'Cables', color: '#C0392B', descripcion: 'Cable de 220 V (fase marrón por el fusible, neutro celeste), multifilar de 6 × 1 mm² hasta la botonera, cable de 2 hilos del sensor y de 8 hilos del Nivel 2. Adentro, el par de cada botón llega a NO y COM de su relé y de ahí sale el paralelo al sensado; van además los cables dupont de J1 a J4, los 12 entre el sensado y la plaqueta de los puentes y los 15 de la plaqueta del ESP32. Los hilos van en mazo atado con precintos.' },\n      { id: 'prensas', grupo: 'M', nombre: 'Prensacables PG11 ×3', corto: 'Prensacables', color: '#1F4FB8', descripcion: 'Mantienen el sellado IP65. Uno solo para los 220 V; otro para el tablero del telar (los pares de los botones, que van a los relés); y el tercero para el sensor de pasada y los cables de los cuatro lectores del Nivel 2.' },\n      { id: 'gabinete', grupo: 'M', nombre: 'Caja estanca IP65', corto: 'Caja IP65', color: '#ECECE7', descripcion: 'Base de 80 mm y tapa de 26 mm con cuatro tornillos, montada en la pared o en una columna, no sobre el chasis del telar.' },\n    ];\n    return this.g1lista;\n  }\n  g1Plaquetas() {\n    if (!this.g1plaq) this.g1plaq = [\n      { n: 1, color: '#B03A2E', nombre: 'Fuente (220 V)', descripcion: 'Placa perforada aparte, con todo lo que lleva 220 V: la HLK-5M05 soldada, la bornera de 220 V (la fase llega por el fusible) y la de 5 V, que va a J1 de la principal.', cobre: 'Placa perforada: pads en toda la grilla y las uniones hechas con estaño, más anchas en los 220 V.' },\n      { n: 2, color: '#1E3A5F', nombre: 'Principal', descripcion: 'Recibe los 5 V por J1, con el electrolítico de 470 µF, y reparte: J2 a los relés, J3 al Nivel 2 y J4 al sensado. En J5, J6 y J7 se sueldan los cables de P1 y P2 de la plaqueta del ESP32. Las tres de 10 kΩ dejan los relés quietos al arrancar.', cobre: 'Pistas y plano de masa según el circuito (el recorrido es aproximado, no copiado del diseño en Proteus). Las pistas del GPIO 34 y del GPIO 35 faltaron y van con puente de alambre; los puentes cortos saltan por encima de otra pista, como en toda plaqueta de una cara.' },\n      { n: 3, color: '#2456B4', nombre: 'Módulos de relé', descripcion: 'Los dos módulos atornillados sobre separadores. J2 trae 5 V, GND, IN1, IN2 y S desde la principal; de ahí sale una tira por módulo, con un cerámico de 100 nF al lado de cada una.', cobre: 'Pistas de 5 V y de las tres señales, y plano de masa (recorrido aproximado). Abajo de cada módulo, las tuercas de sus tornillos.' },\n      { n: 4, color: '#3F4B5C', nombre: 'Nivel 2', descripcion: 'A la izquierda, el canal del sensor de pasada: 1,2 kΩ, PC817 y 10 kΩ al GPIO 35. A la derecha, los cuatro LCA110 en zócalos, cada uno con su 330 Ω y su 10 kΩ a GND. Abajo, B2 y B3, del lado del telar.', cobre: 'El lado del telar (B2 y B3) queda aislado del lado del ESP32: no pasa cobre por debajo del PC817 ni de los LCA110, y la masa queda a más de 3 mm. Recorrido aproximado; la pista del GPIO 19 faltó y va con puente de alambre, y los puentes cortos saltan por encima de otra pista.' },\n      { n: 5, color: '#3D6B96', nombre: 'Sensado de la botonera', descripcion: 'Tres canales iguales (Marcha, Retroceder y Pausa): la bornera J1, J2 o J3, la tira de 4 en el lugar del puente (va a la plaqueta de los puentes), 22 µF, 2,2 kΩ 1 W y PC817. J4 lleva 3,3 V, GND y los GPIO 32, 33 y 34 a la principal; solo el GPIO 34 lleva su 10 kΩ.', cobre: 'Arriba, el lado de 24 V; abajo, el del ESP32 con J4: ninguna pista pasa por debajo de los PC817. Recorrido aproximado, según el circuito.' },\n      { n: 6, color: '#121418', nombre: 'ESP32', descripcion: 'El ESP32 en dos tiras hembra de 19 pines a 25,4 mm: se saca para programarlo. P1 (10 pines) y P2 (5) llevan sus señales por cable a la principal.', cobre: 'Pistas de 1 mm, con las mismas conexiones que el PCB de la plaqueta: cada pin usado del ESP32 va a su pin de P1 o de P2.' },\n      { n: 7, color: '#5B6B7C', nombre: 'Puentes rectificadores', descripcion: 'Los tres DB157, uno por botón, cada uno con su tira de 4 pines (J9 Marcha, J7 Retroceder y J8 Pausa) hacia su canal del sensado. En el cable, las patas 3 y 4 van cruzadas.', cobre: 'Pistas de 1 mm, como en el dibujo de la plaqueta. Mirando del lado de los componentes (desde acá se ven al revés): de cada tira, la pata 1 (+) baja derecho al + del puente, la 2 (~) va al ~ de arriba, la 4 (~) baja por la derecha al ~ de abajo y la 3 (−) rodea por arriba y por la izquierda hasta el −. Entre las tres no hay continuidad.' },\n    ];\n    return this.g1plaq;\n  }\n  g1r() {\n    if (!this.g1estado) this.g1estado = { rotEls: {}, canvas: null, vivo: false, api: null };\n    return this.g1estado;\n  }\n  temaOscuro() {\n    const st = this.state || {};\n    if (st.oscuro !== undefined) return st.oscuro;\n    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }\n  }\n  componentDidMount() {\n    this.g1 = this.g1r();\n    this.g1.vivo = true;\n    const arrancar = () => {\n      if (!this.g1 || !this.g1.vivo) return;\n      const T3 = window.THREE3;\n      if (!T3 || !T3.GTAOPass || !this.g1.canvas) { this.g1.espera = setTimeout(arrancar, 60); return; }\n      try { this.g1.api = this.crearEscena(this.g1.canvas, T3); } catch (e) { console.error(e); }\n    };\n    arrancar();\n  }\n  componentWillUnmount() {\n    if (!this.g1) return;\n    this.g1.vivo = false; clearTimeout(this.g1.espera);\n    if (this.g1.api) this.g1.api.destruir();\n  }\n  component  col = 1;\n        for (let x = 1.6 * k + paso / 2; x < w - k; x += paso, col++) if (col === 1 || col % 5 === 0) g.fillText(String(col), x, 0.9 * k);\n        const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; let fila = 0;\n        for (let y = 1.6 * k + paso / 2; y < h - k; y += paso, fila++) if (fila % 2 === 0 && fila < 26) g.fillText(letras[fila], 0.85 * k, y);\n      });\n    }\n    function separador(g, x, y, z0, alto) {\n      const hex = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, alto, 6), M.laton); hex.rotation.x = PI / 2; hex.position.set(x, y, z0 + alto / 2); g.add(sombra(hex));\n    }\n    function tornillo(g, x, y, z) {\n      const c = new THREE.Mesh(new THREE.SphereGeometry(2.8, 32, 12, 0, PI * 2, 0, PI / 2), M.acero); c.rotation.x = PI / 2; c.scale.set(1, 0.45, 1); c.position.set(x, y, z); g.add(sombra(c));\n      box(g, 3.6, 0.55, 0.6, M.aceroOscuro, x, y, z + 1.05); box(g, 0.55, 3.6, 0.6, M.aceroOscuro, x, y, z + 1.05);\n      const arandela = new THREE.Mesh(new THREE.TorusGeometry(3, 0.35, 8, 32), M.acero); arandela.position.set(x, y, z + 0.2); g.add(arandela);\n    }\n    function placaPerforada(g, cx, cy, w, h) {\n      const tex = texPerforada(w, h); tex.repeat.set(1 / w, 1 / h); tex.offset.set(0.5, 0.5);\n      const cara = est('#FFFFFF', 0.6, 0, { map: tex }), canto = est('#9C6E3B', 0.7);\n      const pl = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(w, h, 2.5), { depth: ESP, bevelEnabled: false, curveSegments: 16 }), [cara, canto]);\n      pl.position.set(cx, cy, T + ALT); g.add(sombra(pl));\n      for (const [dx, dy] of [[-w / 2 + 4, h / 2 - 4], [w / 2 - 4, h / 2 - 4], [-w / 2 + 4, -h / 2 + 4], [w / 2 - 4, -h / 2 + 4]]) { separador(g, cx + dx, cy + dy, T, ALT); tornillo(g, cx + dx, cy + dy, TOPE); }\n    }\n    // Plaqueta impresa de una sola cara, de pertinax: del lado de los componentes no tiene grilla\n    // ni serigrafía, solo el agujero de cada pata y las marcas hechas a mano con fibra (el + de cada\n    // capacitor y la pata 1 de cada PC817 y de cada puente). Las pistas de cobre van abajo: se arman\n    // en el visor de plaquetas (hacerCobre), donde se ve esa cara.\n    function texImpresa(wmm, hmm, agujeros, marcas) {\n      const k = 10;\n      return textura(wmm * k, hmm * k, (g, w, h) => {\n        g.fillStyle = '#C59B60'; g.fillRect(0, 0, w, h);\n        for (let i = 0; i < w * h / 80; i++) { g.fillStyle = `rgba(110,72,30,${Math.random() * 0.06})`; g.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 8, 1); }\n        for (let i = 0; i < 26; i++) {\n          const x = Math.random() * w, y = Math.random() * h, r = (8 + Math.random() * 22) * k;\n          const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(120,80,35,.07)'); gr.addColorStop(1, 'rgba(120,80,35,0)');\n          g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);\n        }\n        const aPx = (u, v) => [(u + wmm / 2) * k, (hmm / 2 - v) * k];\n        for (const [u, v, r = 0.45] of agujeros) {\n          const [x, y] = aPx(u, v);\n          g.fillStyle = 'rgba(80,50,20,.3)'; g.beginPath(); g.arc(x, y, (r + 0.3) * k, 0, PI * 2); g.fill();\n          g.fillStyle = '#2A1C0D'; g.beginPath(); g.arc(x, y, r * k, 0, PI * 2); g.fill();\n        }\n        g.fillStyle = 'rgba(20,22,26,.86)'; g.textAlign = 'center'; g.textBaseline = 'middle';\n        for (const m of marcas) {\n          const [x, y] = aPx(m.u, m.v);\n          g.save(); g.translate(x, y); g.rotate(m.giro || 0);\n          g.font = `italic 700 ${m.tam * k}px \"Comic Sans MS\", \"Segoe Print\", cursive`; g.fillText(m.texto, 0, 0); g.restore();\n        }\n      });\n    }\n    function placaImpresa(g, cx, cy, w, h, agujeros, marcas) {\n      const tex = texImpresa(w, h, agujeros, marcas); tex.repeat.set(1 / w, 1 / h); tex.offset.set(0.5, 0.5);\n      const cara = est('#FFFFFF', 0.52, 0, { map: tex }), canto = est('#9A713F', 0.7);\n      const pl = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(w, h, 1.2), { depth: ESP, bevelEnabled: false, curveSegments: 16 }), [cara, canto]);\n      pl.position.set(cx, cy, T + ALT); g.add(sombra(pl));\n      for (const [dx, dy] of [[-w / 2 + 4, h / 2 - 4], [w / 2 - 4, h / 2 - 4], [-w / 2 + 4, -h / 2 + 4], [w / 2 - 4, -h / 2 + 4]]) { separador(g, cx + dx, cy + dy, T, ALT - 0.08); tornillo(g, cx + dx, cy + dy, TOPE); }\n    }\n    // Siete plaquetas: la de la fuente (1) es de placa perforada; la principal (2), la de los módulos\n    // de relé (3), la del Nivel 2 (4), la del sensado de la botonera (5) y la de los puentes\n    // rectificadores (7, sumada el 31/10/2026) son impresas (diseño en Proteus); y la del ESP32 (6),\n    // impresa, se sumó el 25/10/2026 porque en la principal la tira del ESP32 quedó con los pines en\n    // otro orden: el ESP32 va en la suya y P1 y P2 se cablean a la principal.\n    const PX = -4, PY = -8, PW = 100, PH = 64;\n    const RX = 11, RY = 72, RW = 150, RH = 48;\n    // La fuente va en una placa chica aparte: lo que lleva 220 V queda separado de las demás.\n    const FX = -112, FY = 18, FW = 44, FH = 70;\n    const NX = -2, NY = -81, NW = 128, NH = 46;\n    const SX = 102, SY = -5, SW = 72, SH = 74;\n    // Plaqueta del ESP32, abajo a la izquierda, debajo de la fuente\n    const AX = -103, AY = -55, AW = 62, AH = 56;\n    // Plaqueta de los puentes rectificadores, abajo a la derecha, debajo de la del sensado\n    const QX = 104, QY = -77, QW = 66, QH = 44;\n    // Columnas del sensado, en el orden de J1, J2 y J3 del diseño en Proteus: Marcha, Retroceder y\n    // Pausa. «par» es el par de la botonera y el relé de cada botón (0 Marcha, 1 Pausa, 2 Retroceder).\n    const COL = [{ u: -22, nombre: 'MARCHA', par: 0 }, { u: 0, nombre: 'RETRO', par: 2 }, { u: 22, nombre: 'PAUSA', par: 1 }];\n    const marcasSensado = [];\n    for (const c of COL) {\n      const u = c.u;\n      marcasSensado.push({ u: u - 4.4, v: 3.4, texto: '+', tam: 3.4 }, { u: u - 6.2, v: -14.6, texto: '1', tam: 2.6 });\n    }\n    const placas = new THREE.Group();\n    // En la principal, donde estaba el ESP32, quedan las dos filas de pads de J5 y J7 (arriba) y de J6 y J3\n    // (abajo); los cables de P1 y P2 se sueldan ahí.\n    const marcasPrincipal = [{ u: 8 - 22.86 - 4.5, v: 12.7, texto: 'J5', tam: 2.6 }, { u: 8 + 22.86 + 4.5, v: 12.7, texto: 'J7', tam: 2.6 }, { u: 8 - 22.86 - 4.5, v: -12.7, texto: 'J6', tam: 2.6 }];\n    const marcasEsp = [{ u: -22.86 - 3.4, v: 12.7, texto: '1', tam: 2.4 }];\n    // Los agujeros de cada impresa salen de su lado del cobre (COBRE, más abajo): los de cada pata y los\n    // de montaje\n    const agujerosDe = (clave, w, h) => COBRE[clave].pads.map((p) => [p[0], p[1], 0.45]).concat(COBRE[clave].montaje)\n      .concat([[-w / 2 + 4, h / 2 - 4, 1.6], [w / 2 - 4, h / 2 - 4, 1.6], [-w / 2 + 4, -h / 2 + 4, 1.6], [w / 2 - 4, -h / 2 + 4, 1.6]]);\n    placaImpresa(placas, PX, PY, PW, PH, agujerosDe('principal', PW, PH), marcasPrincipal);\n    placaImpresa(placas, RX, RY, RW, RH, agujerosDe('reles', RW, RH), []);\n    placaPerforada(placas, FX, FY, FW, FH);\n    placaImpresa(placas, NX, NY, NW, NH, agujerosDe('nivel2', NW, NH), []);\n    placaImpresa(placas, SX, SY, SW, SH, agujerosDe('sensado', SW, SH), marcasSensado);\n    placaImpresa(placas, AX, AY, AW, AH, agujerosDe('esp32', AW, AH), marcasEsp);\n    placaImpresa(placas, QX, QY, QW, QH, agujerosDe('puentes', QW, QH), COL.map((c) => ({ u: c.u - 6.4, v: -4.4, texto: '1', tam: 2.6 })));\n    registrar('plaqueta', placas, [PX - PW / 2 + 12, PY - PH / 2 + 2, TOPE + 3]);\n    // Zócalo DIP de 6 patas: dos regletas con los contactos, unidas por las cabeceras, con la muesca\n    // del lado de la pata 1, como el relé que va enchufado encima.\n    const ZOC = 3.2;\n    function zocalo(g, x, y) {\n      const mat = fis('#202227', { roughness: 0.5, clearcoat: 0.2, clearcoatRoughness: 0.5 });\n      for (const s of [-1, 1]) {\n        rbox(g, 2.5, 8.4, ZOC, 0.4, mat, x + s * 3.81, y, TOPE + ZOC / 2, 2);\n        for (let k = -1; k <= 1; k++) box(g, 1.1, 1.1, 0.12, M.negroMate, x + s * 3.81, y + k * 2.54, TOPE + ZOC + 0.02);\n      }\n      for (const s of [-1, 1]) rbox(g, 10.1, 1.2, ZOC - 1, 0.3, mat, x, y + s * 3.6, TOPE + (ZOC - 1) / 2, 2);\n      box(g, 2.4, 0.5, 0.2, M.negroMate, x, y + 3.95, TOPE + ZOC - 0.9);\n    }\n\n    // ── Piezas electrónicas ────────────────────────────────────────────\n    const BANDAS = { 0: '#1A1A1A', 1: '#7A4A2A', 2: '#D33A2C', 3: '#E8822A', 4: '#E8C72A', 5: '#2E9B5A', 6: '#2B5FD9', 7: '#7B4BB7', 8: '#8A8A8A', 9: '#F2F2F2', oro: '#C9A44A' };\n    const cacheBandas = {};\n    function resistencia(g, x, y, largo, radio, cuerpo, bandas) {\n      const pts = [], N = 40;\n      for (let i = 0; i <= N; i++) {\n        const t = i / N, k = Math.min(t, 1 - t);\n        const tp = Math.sin(Math.min(1, k / 0.09) * PI / 2);\n        const gauss = (c) => Math.exp(-Math.pow((t - c) / 0.085, 2));\n        const bulto = 0.84 + 0.16 * Math.max(gauss(0.14), gauss(0.86));\n        pts.push(new THREE.Vector2(Math.max(0.001, radio * tp * bulto), -largo / 2 + t * largo));\n      }\n      const clave = cuerpo + bandas.join(',');\n      if (!cacheBandas[clave]) cacheBandas[clave] = fis('#FFFFFF', { roughness: 0.45, clearcoat: 0.35, clearcoatRoughness: 0.4, bumpMap: granoFino, bumpScale: 0.1, map: textura(32, 512, (gg, w, h) => {\n        gg.fillStyle = cuerpo; gg.fillRect(0, 0, w, h);\n        const pos = [0.26, 0.38, 0.5, 0.74];\n        bandas.forEach((b, i) => { gg.fillStyle = BANDAS[b]; const c = (1 - pos[i]) * h; gg.fillRect(0, c - h * 0.036, w, h * 0.072); });\n      }) });\n      const me = new THREE.Mesh(new THREE.LatheGeometry(pts, 28), cacheBandas[clave]);\n      const z = TOPE + radio + 0.8;\n      me.rotation.z = PI / 2; me.position.set(x, y, z); g.add(sombra(me));\n      const L = largo / 2;\n      for (const s of [-1, 1]) tubo(g, [[x + s * L * 0.97, y, z], [x + s * (L + 1.5), y, z], [x + s * (L + 2.3), y, z - 0.9], [x + s * (L + 2.3), y, TOPE - 0.4]], 0.3, M.estano, 8);\n    }\n
